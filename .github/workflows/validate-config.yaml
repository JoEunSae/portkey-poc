name: Deploy Portkey Config

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Convert YAML to JSON
        run: |
          python convert.py

      - name: Create Config
        run: |
          curl -X POST \
            https://api.portkey.ai/v1/configs \
            -H "x-portkey-api-key: uopbGCbN43VEucPIKGunwCuLhpiY"
            -H "Content-Type: application/json" \
            -d @config.json


